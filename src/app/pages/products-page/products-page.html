<app-title [title]="title"></app-title>

<!-- Category buttons -->
<section class="px-6 py-8 max-w-3xl mx-auto">
  <div class="grid grid-cols-1 gap-3 mb-3">
    <button
      (click)="selectCategory('All')"
      class="py-4 text-xs uppercase tracking-widest border transition-colors duration-200"
      [style.background-color]="selectedCategory() === 'All' ? '#1a6c7a' : 'transparent'"
      [style.color]="selectedCategory() === 'All' ? '#ffffff' : '#1a6c7a'"
      [style.border-color]="'#1a6c7a'">
      All
    </button>
  </div>

  <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
    @for (cat of categories; track cat) {
      @if (cat !== 'All') {
        <button
          (click)="selectCategory(cat)"
          class="py-4 text-xs uppercase tracking-widest border transition-colors duration-200"
          [style.background-color]="selectedCategory() === cat ? '#1a6c7a' : 'transparent'"
          [style.color]="selectedCategory() === cat ? '#ffffff' : '#1a6c7a'"
          [style.border-color]="'#1a6c7a'">
          {{ cat }}
        </button>
      }
    }
  </div>
</section>

<section class="px-6 pb-4 max-w-3xl mx-auto">
  <h2 class="text-center uppercase tracking-widest text-sm text-[#000f2b]">
    {{ selectedCategory() === 'All' ? 'Featured Products' : selectedCategory() }}
  </h2>
  <hr class="mt-3 border-gray-300">
</section>

<!-- Gallery -->
<section class="px-6 pb-12 max-w-6xl mx-auto">
  <app-product-gallery [category]="selectedCategory()" />
</section>
